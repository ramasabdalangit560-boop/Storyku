<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storyku</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--sf:#fff;--tx:#0b1b33;--mu:#5b6f8f;--bl:#1456d9;--bd:#0a2f78;--ye:#ffc928;--ln:#d5e3fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071226;--sf:#0e2146;--tx:#f2f7ff;--mu:#9bb2d8;--bl:#4b8bff;--bd:#cfe0ff;--ln:#1c3669}}
:root[data-theme="dark"]{--bg:#071226;--sf:#0e2146;--tx:#f2f7ff;--mu:#9bb2d8;--bl:#4b8bff;--bd:#cfe0ff;--ln:#1c3669}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bl);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bl);z-index:10}
.logo{font:800 24px 'Baloo 2';letter-spacing:.2px}.logo b{color:var(--ye)}
.search{flex:1;border:0;border-radius:99px;padding:9px 14px;background:#fff;color:#0b1b33;min-width:0}
.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--ye);background:#fff center/cover;cursor:pointer;flex:none;padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 14px 110px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.cv{aspect-ratio:3/4;background:linear-gradient(160deg,var(--bl),var(--bd)) center/cover;display:grid;place-items:center;color:#fff;font:800 28px 'Baloo 2'}
.card .t{padding:8px 10px 10px}.card h3{font-size:16px}.tag{display:inline-block;margin-top:4px;background:var(--ye);color:#111;border-radius:6px;padding:0 8px;font-size:12px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:50px 20px}
.fab{position:fixed;left:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:3px solid #111;background:var(--ye);color:#111;font:800 34px/1 'Baloo 2';cursor:pointer;z-index:6;box-shadow:0 4px 0 #111}
.view{display:none}.view.on{display:block}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
:root[data-theme="dark"] .bar,:root:not([data-theme="light"]) .bar{--x:0}
.bar button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.slide{background:var(--sf);margin:0 0 3px;padding:34px 22px;min-height:46vh;display:flex;align-items:center;border-left:5px solid var(--ye);font-size:18px;line-height:1.8;white-space:pre-wrap}
.hero{padding:26px 20px;background:linear-gradient(160deg,var(--bl),var(--bd));color:#fff}
.hero p{opacity:.9}
.sheet{padding:18px 16px 40px}
label{display:block;font-weight:800;margin:14px 0 4px}
.in{width:100%;border:2px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--sf)}
textarea.in{min-height:46vh;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--bl);color:#fff}
.btn.y{background:var(--ye);color:#111}.btn.g{background:transparent;border:2px solid var(--ln);color:var(--tx)}.btn.r{background:#c62828}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pv{width:120px;aspect-ratio:3/4;border-radius:10px;background:var(--ln) center/cover;margin-top:8px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-top:14px}
.steps{display:flex;gap:6px;margin-bottom:6px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--ye)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;display:none}
.small{color:var(--mu);font-size:14px}
</style></head><body>
<div class="app">
<div id="home" class="view on">
<header><span class="logo">Story<b>ku</b></span><input class="search" id="q" placeholder="Cari judul atau genre…" type="search"><button class="av" id="avH" aria-label="Pengaturan"></button></header>
<div class="grid" id="grid"></div>
<button class="fab" id="fab" aria-label="Tambah cerita" hidden>+</button>
</div>

<div id="read" class="view">
<div class="bar"><button data-go="home" aria-label="Kembali">←</button><b id="rT"></b></div>
<div class="hero"><h2 id="rH"></h2><span class="tag" id="rG"></span><p id="rD"></p></div>
<div id="slides"></div>
</div>

<div id="add" class="view">
